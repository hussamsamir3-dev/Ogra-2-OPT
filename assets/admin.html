<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070b14">
<title>Ogra Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#070b14; --deck:#0c1322; --panel:#111a2c; --panel2:#16213a; --line:rgba(140,190,255,.12); --line2:rgba(140,190,255,.22);
  --tx:#e6ecf7; --mut:#8d9ab2; --dim:#5d6a82;
  --amber:#ffb627; --amber2:#ffd98a; --cyan:#2ee6ff; --ok:#39f28b; --bad:#ff4d5e; --warn:#ff9f43; --dev:#b18cff;
  --r1:8px; --r2:14px;
  --num:Rajdhani,Cairo,system-ui,sans-serif; --txt:Cairo,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--tx);font:14px/1.5 var(--txt)}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(255,182,39,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(46,230,255,.05),transparent 60%),var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
a{color:var(--cyan)}
.hidden{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#22304c;border-radius:10px;border:2px solid var(--night)}

/* ---------- sign-in ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--night)}
#login .art{position:relative;overflow:hidden;background:#0a1020}
#login .art canvas{position:absolute;inset:0;width:100%;height:100%}
#login .art .cap{position:absolute;left:48px;bottom:44px;right:48px}
#login .art .cap b{display:block;font:700 56px/1 var(--num);color:var(--amber2);letter-spacing:.02em}
#login .art .cap span{color:var(--mut);font-size:15px}
#login .lform{display:grid;place-items:center;padding:32px}
#login form{width:min(380px,100%)}
#login h1{font:700 30px/1.1 var(--num);margin:0 0 6px;letter-spacing:.02em}
#login p{color:var(--mut);margin:0 0 26px}
.field{display:block;margin:0 0 14px}
.field span{display:block;color:var(--mut);font-size:12.5px;margin:0 0 6px;font-weight:600}
.in{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line2);background:#0a1120;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--amber)}
textarea.in{font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:10px;font-weight:700;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:rgba(140,190,255,.4);background:#1b2844}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pri{background:linear-gradient(180deg,var(--amber2),var(--amber));color:#1b1204;border-color:transparent}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:#ffd3d7;border-color:rgba(255,77,94,.45);background:rgba(255,77,94,.1)}
.btn.danger:hover{background:rgba(255,77,94,.2)}
.btn.good{color:#c9ffe0;border-color:rgba(57,242,139,.4);background:rgba(57,242,139,.09)}
.btn.devb{color:#e4d6ff;border-color:rgba(177,140,255,.45);background:rgba(177,140,255,.1)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.wide{width:100%;padding:12px}
.err{color:#ff9ea7;font-size:13px;min-height:1.4em;margin-top:10px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:232px 1fr;height:100%}
aside{border-right:1px solid var(--line);background:rgba(8,12,22,.7);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand .mk{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,var(--amber2),var(--amber));display:grid;place-items:center;color:#1b1204;font:700 20px/1 var(--num)}
.brand b{font:700 19px/1 var(--num);letter-spacing:.03em;display:block}
.brand small{color:var(--mut);font-size:11.5px}
nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:var(--mut);font-weight:700;text-align:left;margin:2px 0}
nav button svg{width:18px;height:18px;flex:none;opacity:.85}
nav button:hover{background:rgba(140,190,255,.06);color:var(--tx)}
nav button.on{background:rgba(255,182,39,.1);color:var(--amber2);box-shadow:inset 3px 0 0 var(--amber)}
nav .cnt{margin-left:auto;font:700 12px/1 var(--num);padding:3px 7px;border-radius:20px;background:rgba(255,77,94,.18);color:#ffb3ba}
nav .cnt:empty{display:none}
aside .me{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
aside .me b{display:block;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{overflow:auto;min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(7,11,20,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h2{margin:0;font:700 22px/1 var(--num);letter-spacing:.02em}
.top .sp{flex:1}
.live{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(57,242,139,.6);animation:pulse 2s infinite}
.live.off i{background:var(--dim);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(57,242,139,.55)}70%{box-shadow:0 0 0 8px rgba(57,242,139,0)}100%{box-shadow:0 0 0 0 rgba(57,242,139,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.search{position:relative;width:min(340px,40vw)}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.page{padding:24px 28px 60px}
.demo{background:rgba(177,140,255,.12);color:#dccfff;border:1px solid rgba(177,140,255,.3);padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}

/* ---------- overview ---------- */
.board{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{color:var(--mut);font-size:12.5px;font-weight:600}
.kpi .v{font:700 34px/1.1 var(--num);margin-top:4px}
.kpi .s{color:var(--dim);font-size:12px;margin-top:2px}
.kpi.hero{background:linear-gradient(160deg,#18243d,#0f1728);border-color:rgba(255,182,39,.28)}
.kpi.hero .v{font-size:64px;color:var(--amber2);line-height:1}
.kpi.hero .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle}
.kpi.alert .v{color:#ff8a95}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:10px}
.card h3 small{color:var(--dim);font-weight:600;font-size:12px}
.card h3 .sp{flex:1}
.chart svg{width:100%;display:block}
.legend{display:flex;gap:14px;color:var(--mut);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bars .row{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;margin:9px 0}
.bars .track{height:8px;background:#0a1120;border-radius:6px;overflow:hidden;margin-top:5px}
.bars .fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));border-radius:6px}
.bars .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .n{text-align:right;font:700 15px var(--num)}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.mini li:first-child{border-top:0}
.mini li:hover .who b{color:var(--amber2)}
.who{min-width:0;flex:1}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.who small{color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:13px}

/* ---------- tables ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line2);color:var(--mut);font-weight:700;font-size:13px}
.chip.on{background:var(--tx);color:#0b1120;border-color:transparent}
.chip b{font-family:var(--num);margin-left:4px;opacity:.8}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tblwrap{overflow:auto;border-radius:var(--r2)}
.tbl th{position:sticky;top:0;text-align:left;font-size:12px;font-weight:700;color:var(--mut);padding:11px 12px;background:#131d31;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:rgba(140,190,255,.045)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .who{max-width:260px}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--num);color:#0b1120;flex:none;position:relative}
.av .st{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--panel);background:var(--dim)}
.av .st.on{background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:800;line-height:1.6}
.pill.bad{background:rgba(255,77,94,.15);color:#ff9aa4}
.pill.ok{background:rgba(57,242,139,.13);color:#8ff5b9}
.pill.dev{background:rgba(177,140,255,.16);color:#d3c0ff}
.pill.warn{background:rgba(255,159,67,.15);color:#ffc28a}
.pill.mut{background:rgba(140,190,255,.09);color:var(--mut)}
.pill.amb{background:rgba(255,182,39,.14);color:var(--amber2)}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;color:var(--mut);font-size:13px}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(3,6,12,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100vw);background:var(--deck);border-left:1px solid var(--line2);z-index:21;transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.45)}
#drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
.dh{padding:20px 24px 0;border-bottom:1px solid var(--line)}
.dh .row1{display:flex;gap:14px;align-items:center}
.dh .av{width:54px;height:54px;border-radius:14px;font-size:22px}
.dh h2{margin:0;font:700 24px/1.1 var(--num);letter-spacing:.01em}
.dh .meta{color:var(--mut);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.dh .x{margin-left:auto;align-self:flex-start;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);font-size:18px;color:var(--mut)}
.dh .x:hover{color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.stat span{display:block;color:var(--dim);font-size:11.5px;font-weight:600}
.stat b{font:700 20px/1.2 var(--num)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{padding:10px 14px;color:var(--mut);font-weight:700;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--amber2);border-color:var(--amber)}
.tabs button b{font-family:var(--num);margin-left:5px;color:var(--dim)}
.db{flex:1;overflow:auto;padding:20px 24px 90px}
.banbox{background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.35);border-radius:12px;padding:12px 14px;margin:14px 0 0;display:flex;gap:12px;align-items:center}
.banbox b{color:#ffb3ba}
.devbox{background:rgba(177,140,255,.08);border:1px solid rgba(177,140,255,.35);border-radius:12px;padding:12px 14px;margin:14px 0 0;color:#dccfff}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.form .span2{grid-column:span 2}.form .span3{grid-column:1/-1}
.form .field{margin:0}
.field.changed .in{border-color:var(--amber);background:rgba(255,182,39,.05)}
.sticky{position:sticky;bottom:-90px;margin:18px -24px -90px;padding:14px 24px;background:rgba(12,19,34,.96);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sticky .sp{flex:1}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.veh{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.veh.own{border-color:rgba(57,242,139,.35)}
.veh.cur{box-shadow:inset 0 0 0 1px var(--amber);border-color:var(--amber)}
.veh .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.veh .h b{font-size:13.5px;line-height:1.3}
.veh .h small{display:block;color:var(--dim);font-size:11.5px}
.veh .f{display:flex;gap:6px;flex-wrap:wrap}
.flag{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.flag:first-child{border-top:0}
.flag pre{margin:6px 0 0;padding:8px 10px;background:#0a1120;border-radius:8px;font-size:11.5px;color:#aebad0;white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:auto}
.sev{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 16px var(--num)}
.sev.s1{background:rgba(140,190,255,.1);color:var(--mut)}.sev.s2{background:rgba(255,159,67,.15);color:#ffc28a}.sev.s3{background:rgba(255,77,94,.18);color:#ff9aa4}

/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,6,12,.66);backdrop-filter:blur(4px);padding:20px}
.mbox{width:min(520px,100%);background:var(--deck);border:1px solid var(--line2);border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mbox h3{margin:0 0 4px;font:700 22px/1.2 var(--num)}
.mbox p{margin:0 0 16px;color:var(--mut)}
.mbox .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.opt{padding:10px;border-radius:10px;border:1px solid var(--line2);font-weight:700;text-align:center}
.opt.on{border-color:var(--bad);background:rgba(255,77,94,.12);color:#ffc5cb}
#toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#18233b;border:1px solid var(--line2);border-left:3px solid var(--ok);padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:420px;font-weight:600}
.toast.bad{border-left-color:var(--bad)}

.split{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}
.hint{color:var(--dim);font-size:12.5px;margin-top:8px}
code{font:12px ui-monospace,Menlo,monospace;background:#0a1120;padding:2px 6px;border-radius:6px;color:#c7d3ea}
.kbd{border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:0 6px;font:12px var(--num);color:var(--mut)}

@media (max-width:1180px){.board{grid-template-columns:repeat(3,1fr)}.kpi.hero{grid-column:span 3}.grid2,.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){#app{grid-template-columns:1fr}aside{position:fixed;inset:auto 0 0 0;flex-direction:row;padding:6px;z-index:10;border-right:0;border-top:1px solid var(--line)}aside .brand,aside .me{display:none}nav{display:flex;width:100%;overflow-x:auto}nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}nav button.on{box-shadow:inset 0 -3px 0 var(--amber)}nav .cnt{display:none}.page{padding:16px 14px 90px}.top{padding:12px 14px}.search{width:auto;flex:1}.form{grid-template-columns:1fr 1fr}#login{grid-template-columns:1fr}#login .art{display:none}.board{grid-template-columns:1fr 1fr}.kpi.hero{grid-column:span 2}}
</style>
</head>
<body>

<!-- ================= SIGN IN ================= -->
<section id="login">
  <div class="art"><canvas id="skyline"></canvas>
    <div class="cap"><b>OGRA CONTROL ROOM</b><span>Every driver, every fare, every flag — watched from one desk.</span></div>
  </div>
  <div class="lform">
    <form id="loginForm" autocomplete="on">
      <h1>Admin sign in</h1>
      <p>Use the same account you play Ogra with. It must be listed as an admin.</p>
      <label class="field"><span>Email</span><input class="in" id="lEmail" type="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input class="in" id="lPass" type="password" autocomplete="current-password" required></label>
      <button class="btn pri wide" id="lBtn" type="submit">Sign in</button>
      <div class="err" id="lErr"></div>
      <div class="hint">Preview without a database: <a href="?demo=1">open demo data</a></div>
    </form>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="mk">O</div><div><b>OGRA</b><small>Control room</small></div></div>
    <nav id="nav"></nav>
    <div class="me"><b id="meEmail"></b><span id="meRole">Admin</span><div style="margin-top:8px"><button class="btn sm" id="signOut">Sign out</button></div></div>
  </aside>
  <main>
    <div class="top">
      <h2 id="viewTitle">Overview</h2>
      <span id="demoTag" class="demo hidden">Demo data</span>
      <div class="sp"></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="in" id="gSearch" placeholder="Find a player by email, name or ID"></div>
      <div class="live" id="live"><i></i><span id="liveTxt">Live</span></div>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>

<div id="scrim"></div>
<section id="drawer" aria-label="Player"></section>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>

<script src="assets/supabase.js"></script>
<script>
/* ================= CONFIG ================= */
const CFG = {
  url: 'https://xncztvekfhyihshlatvz.supabase.co',
  key: 'sb_publishable_oJOOzGXc3xgl1k44rFlyzQ_TSaJ3gb4',
  refreshMs: 20000,
  onlineWindowMs: 120000
};
const VEHICLES = [
  ['v_n300','Chevrolet N300 Van','micro',11,1],['v_suzuki','Suzuki Every Minivan','micro',7,1],['v_foton','Foton Gratour Mini','micro',8,2],

const until = t => { const s = (new Date(t) - Date.now())/1000; if (new Date(t).getFullYear() > 9000) return 'permanent'; if (s < 3600) return Math.max(1, Math.ceil(s/60))+' min'; if (s < 86400) return Math.ceil(s/3600)+' h'; return Math.ceil(s/86400)+' days'; };

/* ================= CHARTS ================= */
function barChart(data){
  const W = 760, H = 210, pl = 34, pb = 24, pt = 10, n = data.length, max = Math.max(4, ...data.map(d => d.ok + d.bad));
  const bw = (W - pl)/n, sy = v => (H - pb - pt)*v/max;
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = H - pb - (H - pb - pt)*i/4; g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(140,190,255,.08)"/><text x="${pl - 8}" y="${y + 4}" fill="#5d6a82" font-size="11" text-anchor="end" font-family="Rajdhani">${Math.round(max*i/4)}</text>`; }
  data.forEach((d, i) => { const x = pl + i*bw + bw*.18, w = bw*.64, h1 = sy(d.ok), h2 = sy(d.bad);
    g += `<rect x="${x}" y="${H - pb - h1}" width="${w}" height="${h1}" rx="2" fill="#ffb627"><title>${new Date(d.t).getHours()}:00 — ${d.ok} accepted, ${d.bad} rejected</title></rect>`;
    if (h2) g += `<rect x="${x}" y="${H - pb - h1 - h2}" width="${w}" height="${h2}" rx="2" fill="#ff4d5e"/>`;
    if (i % 3 === 0) g += `<text x="${x + w/2}" y="${H - 6}" fill="#5d6a82" font-size="11" text-anchor="middle" font-family="Rajdhani">${String(new Date(d.t).getHours()).padStart(2, '0')}:00</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trips per hour">${g}</svg>`;
}
function lineChart(data){
  const W = 420, H = 210, pl = 26, pb = 24, pt = 14, max = Math.max(3, ...data.map(d => d.n)), n = data.length;
  const X = i => pl + (W - pl - 8)*i/(n - 1), Y = v => H - pb - (H - pb - pt)*v/max;
  const pts = data.map((d, i) => [X(i), Y(d.n)]), path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  let g = '';
  for (let i = 0; i <= 3; i++) { const y = Y(max*i/3); g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(140,190,255,.08)"/><text x="${pl - 6}" y="${y + 4}" fill="#5d6a82" font-size="11" text-anchor="end" font-family="Rajdhani">${Math.round(max*i/3)}</text>`; }
  g += `<defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2ee6ff" stop-opacity=".35"/><stop offset="1" stop-color="#2ee6ff" stop-opacity="0"/></linearGradient></defs>`;
  g += `<path d="${path}L${X(n - 1)},${H - pb}L${X(0)},${H - pb}Z" fill="url(#lg)"/><path d="${path}" fill="none" stroke="#2ee6ff" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#070b14" stroke="#2ee6ff" stroke-width="2"><title>${data[i].d}: ${data[i].n}</title></circle>`;
    if (i % 3 === 1 || i === n - 1) g += `<text x="${p[0]}" y="${H - 6}" fill="#5d6a82" font-size="11" text-anchor="middle" font-family="Rajdhani">${new Date(data[i].d).toLocaleDateString([], {day:'numeric', month:'short'})}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sign-ups per day">${g}</svg>`;
}

function auditTable(list, withTarget){
  if (!list.length) return '<div class="card"><div class="empty">No admin actions yet.</div></div>';
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>When</th><th>Admin</th><th>Action</th>${withTarget ? '<th>Target</th>' : ''}<th>Detail</th></tr></thead><tbody>

function auditDetail(a){ const d = a.detail || {};

  if (t.closest('[data-rmdev]')) { e.stopPropagation(); const id = t.closest('[data-rmdev]').dataset.rmdev; return removeDevModal(id); }
  if (t.closest('[data-rmadmin]')) { const b = t.closest('[data-rmadmin]'); return confirmModal('Revoke admin access?', `${esc(b.dataset.email)} will no longer be able to open the control room.`, 'Revoke', () => API.rpc('admin_revoke_admin', {p_user:b.dataset.rmadmin}), 'Admin access revoked'); }

});

        case 'admin_remove_vehicle': { const i = V.findIndex(v => v.player_id === p.id && v.vehicle_id === a.p_vehicle); if (i >= 0) V.splice(i, 1); log('remove_vehicle', p.id, {vehicle:a.p_vehicle}); return wait(null); }
        case 'admin_set_current_vehicle': V.filter(v => v.player_id === p.id).forEach(v => v.is_current = v.vehicle_id === a.p_vehicle); log('set_current_vehicle', p.id, {vehicle:a.p_vehicle}); return wait(null);
        case 'admin_repair_vehicles': V.filter(v => v.player_id === p.id).forEach(v => v.fuel = 60); log('repair_refuel', p.id, null); return wait(null);
        case 'admin_make_dev': p.is_dev = true; devify(p); VEHICLES.forEach(v => { if (!V.some(x => x.player_id === p.id && x.vehicle_id === v[0])) V.push({player_id:p.id, vehicle_id:v[0], fuel:60, bought_at:new Date().toISOString()}); }); F.filter(f => f.player_id === p.id).forEach(f => f.reviewed = true); log('make_dev', p.id, null); return wait(p);
        case 'admin_remove_dev': p.is_dev = false; if (a.p_reset) { Object.assign(p, {cash:7000, level:1, xp:0, licence_class:'none', licence_exp:null}); for (let i = V.length - 1; i >= 0; i--) if (V[i].player_id === p.id && V[i].vehicle_id !== 'v_n300') V.splice(i, 1); } log('remove_dev', p.id, {reset:a.p_reset}); return wait(p);
        case 'admin_reset_player': Object.assign(p, {cash:7000, level:1, xp:0, licence_class:'none', licence_exp:null, total_trips:0, total_pax:0, total_km:0, total_fines:0}); for (let i = V.length - 1; i >= 0; i--) if (V[i].player_id === p.id) V.splice(i, 1); V.push({player_id:p.id, vehicle_id:'v_n300', fuel:20, is_current:true, bought_at:new Date().toISOString()}); log('reset_progress', p.id, null); return wait(p);
        case 'admin_update_save': S[p.id] = a.p_data; log('edit_save', p.id, null); return wait(null);
        case 'admin_review_flag': { const f = F.find(x => x.id === a.p_id); f.reviewed = a.p_reviewed; log(a.p_reviewed ? 'flag_reviewed' : 'flag_reopened', f.player_id, {flag:f.id}); return wait(null); }
        case 'admin_review_all_flags': F.filter(f => f.player_id === p.id).forEach(f => f.reviewed = true); log('flags_cleared', p.id, null); return wait(null);
        case 'admin_delete_player': P.splice(P.indexOf(p), 1); log('delete_player', a.p_player, {email:p.email}); return wait(null);
        case 'admin_grant_admin': ADM.push({user_id:uid(), email:a.p_email, added_at:new Date().toISOString(), added_by:'demo-admin@ogra.app'}); log('grant_admin', null, {email:a.p_email}); return wait(null);
        case 'admin_revoke_admin': ADM.splice(ADM.findIndex(x => x.user_id === a.p_user), 1); log('revoke_admin', a.p_user, null); return wait(null);
      }
      return Promise.reject(new Error('demo: ' + fn));
    },
    account(b){
      if (b.action === 'create_dev') { const id = uid(); const p = {id, email:b.email, name:b.name || null, created_at:new Date().toISOString(), last_seen:new Date().toISOString(), cash:0, xp:0, level:1, reputation:5, licence_class:'none', total_trips:0, total_pax:0, total_km:0, total_fines:0, is_dev:false, dev_note:b.note};
        P.unshift(p); S[id] = {}; return this.rpc('admin_make_dev', {p_player:id}).then(() => ({ok:true, id})); }
      if (b.action === 'delete_account') return this.rpc('admin_delete_player', {p_player:b.id});
      log(b.action, b.id, null); return wait({ok:true});
    }
  };
})();

boot();
</script>
